[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "portal-ml"
version = "1.0.0"
description = "Four-layer decoupled neuroevolutionary reasoning agent for Portal 1: symbolic Blackboard + LiDAR, evolved Behavior Tree DSL, neuroevolved multi-skill MLPs, and a 20/20 LoRA-tuned 1.2B strategic planner"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["portal_ml*"]
